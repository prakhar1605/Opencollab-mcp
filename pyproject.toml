[build-system]
requires = ["hatchling<1.27"]
build-backend = "hatchling.build"

[project]
name = "opencollab-mcp"
version = "0.6.1"
description = "An MCP server that finds matching 'good first issues' on GitHub for your AI assistant to recommend"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
    { name = "Prakhar Pandey", email = "prakhar9999pandey@gmail.com" },
]
keywords = ["mcp", "open-source", "github", "contributions", "ai", "good-first-issue"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "mcp[cli]>=1.2.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.5.0",
]

[project.scripts]
opencollab-mcp = "opencollab_mcp.server:main"

[project.urls]
Homepage = "https://github.com/prakhar1605/Opencollab-mcp"
Repository = "https://github.com/prakhar1605/Opencollab-mcp"
Issues = "https://github.com/prakhar1605/Opencollab-mcp/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/opencollab_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# E (pycodestyle errors), F (pyflakes), W (warnings), I (import order),
# UP (pyupgrade), B (bugbear). Ignoring E501 (long lines — covered by formatter)
# and E701 (single-line if-statements — fine for compact score-mapping blocks).
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501", "E701"]
