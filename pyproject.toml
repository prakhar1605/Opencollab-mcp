[build-system]
requires = ["hatchling<1.27"]
build-backend = "hatchling.build"

[project]
name = "opencollab-mcp"
version = "0.5.0"
description = "MCP server that finds your next open source contribution. Profile → matched issues → PR plan, in one prompt."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
    { name = "Prakhar Pandey", email = "prakhar9999pandey@gmail.com" },
]
keywords = ["mcp", "model-context-protocol", "claude", "open-source", "github", "good-first-issue", "hacktoberfest", "ai"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: Version Control :: Git",
]
dependencies = [
    "mcp[cli]>=1.2.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "cachetools>=5.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-httpx>=0.30",
    "ruff>=0.5",
    "mypy>=1.8",
    "types-cachetools>=5.0",
]

[project.scripts]
opencollab-mcp = "opencollab_mcp.server:main"

[project.urls]
Homepage = "https://github.com/prakhar1605/Opencollab-mcp"
Repository = "https://github.com/prakhar1605/Opencollab-mcp"
Issues = "https://github.com/prakhar1605/Opencollab-mcp/issues"
Changelog = "https://github.com/prakhar1605/Opencollab-mcp/blob/main/CHANGELOG.md"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
warn_unused_ignores = true
warn_return_any = false
ignore_missing_imports = true
strict_optional = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
