name: Bug report
description: Something is broken or behaving unexpectedly
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please fill in the fields
        below — the more detail, the faster we can fix it.

  - type: input
    id: version
    attributes:
      label: Version
      description: Run `pip show opencollab-mcp | grep Version`
      placeholder: "0.5.0"
    validations:
      required: true

  - type: dropdown
    id: client
    attributes:
      label: MCP client
      options:
        - Claude Desktop
        - Cursor
        - Continue.dev
        - Zed
        - VS Code
        - Other (please specify in description)
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you expect, what happened instead?
      placeholder: |
        I asked Claude to "find me a Python good first issue" and got...
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Configure MCP client with...
        2. Send prompt...
        3. See error
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant logs (set OPENCOLLAB_LOG_LEVEL=DEBUG)
      render: shell
