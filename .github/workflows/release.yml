name: Release

# Publishes to PyPI when a version tag (v0.6.1, v1.0.0, ...) is pushed.
# Uses PyPI trusted publishing (OIDC) — no API token secret needed, but the
# publisher must be registered once at:
#   https://pypi.org/manage/project/opencollab-mcp/settings/publishing/
# (owner: prakhar1605, repo: Opencollab-mcp, workflow: release.yml)

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify tag matches package version
        run: |
          PKG_VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "Tag $GITHUB_REF_NAME does not match pyproject version $PKG_VERSION" >&2
            exit 1
          fi

      - name: Run tests
        run: |
          pip install -e ".[dev]"
          pytest -q

      - name: Build distribution
        run: |
          pip install build
          python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
