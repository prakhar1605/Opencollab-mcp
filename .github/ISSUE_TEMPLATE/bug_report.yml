name: Bug report
description: Report a problem with opencollab-mcp
labels: ["bug"]
body:
  - type: input
    id: version
    attributes:
      label: opencollab-mcp version
      description: Run `opencollab-mcp --version` and paste the output.
      placeholder: "e.g. 0.3.1"
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How did you install it?
      options:
        - uvx
        - pip
        - Docker
        - Other
    validations:
      required: true
  - type: dropdown
    id: transport
    attributes:
      label: Transport
      options:
        - stdio
        - streamable-http
    validations:
      required: true
  - type: textarea
    id: tool
    attributes:
      label: Tool and arguments used
      description: The tool name and the arguments you passed.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Paste any error output.
      render: shell
    validations:
      required: false
